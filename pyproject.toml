[project]
name = "unshredder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikola Rahman", email = "nikola.rahman.89@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "elkai>=2.0.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn>=0.54.0",
    "wandb>=0.31.0",
]

[project.scripts]
unshredder = "unshredder:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
